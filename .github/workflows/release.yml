name: Release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute next version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("version-"))] | map(sub("version-";"") | tonumber) | max // 0')
          echo "TAG=version-$((LAST + 1))" >> "$GITHUB_ENV"

      - name: Package mod
        run: zip -r "Victoria.II_Baltic.Awakening_Mod.zip" Baltic_Awakening Baltic_Awakening.mod README.md

      - name: Write release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf 'Merged PR #%s: %s\n\n' "$PR_NUMBER" "$PR_TITLE" > release-notes.md
          printf '%s\n' "$PR_BODY" >> release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
        run: |
          gh release create "$TAG" "Victoria.II_Baltic.Awakening_Mod.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target main \
            --notes-file release-notes.md
